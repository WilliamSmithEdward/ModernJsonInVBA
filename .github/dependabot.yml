version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # security/requirements.txt pins the scanners the Malware scan installs.
  - package-ecosystem: pip
    directory: /security
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The ClamAV engine the malware scan runs, pinned by digest.
  - package-ecosystem: docker
    directory: /.github/security/clamav
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
