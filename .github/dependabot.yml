version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # .github/requirements holds the hash-locked tools each workflow installs.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The ClamAV engine the malware scan runs, pinned by digest.
  - package-ecosystem: docker
    directory: /.github/security/clamav
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
