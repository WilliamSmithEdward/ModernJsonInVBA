name: Security

# olevba and mraptor scan every VBA file. Runs daily, on pushes and pull
# requests. ClamAV and YARA-X run in malware-scan.yml.
# release-security-report.yml runs both when a release is published and
# attaches the combined report. See SECURITY.md.
# zizmor audits the workflows themselves and keeps its own exceptions (see its job).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *" # Daily at 08:17 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: Release name for the report title
        type: string
        default: ""

permissions:
  contents: read

jobs:
  macros:
    name: olevba and mraptor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs tags for the report label
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install oletools
        run: python -m pip install --require-hashes -r .github/requirements/security.txt

      - name: Scan
        env:
          LABEL: ${{ inputs.label }}
        run: python security/scan.py --out security-report ${LABEL:+--label "$LABEL"}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: security-report/
          if-no-files-found: error

  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  security-passed:
    name: Security passed
    if: always()
    needs: [macros, zizmor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
