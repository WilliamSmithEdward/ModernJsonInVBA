name: Security

# olevba and mraptor scan every VBA file. Runs daily, on pushes and pull
# requests. ClamAV and YARA-X run in malware-scan.yml.
# release-security-report.yml runs both when a release is published and
# attaches the combined report. See SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *" # Daily at 08:17 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: Release name for the report title
        type: string
        default: ""

permissions:
  contents: read

jobs:
  macros:
    name: olevba and mraptor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs tags for the report label

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install oletools
        run: python -m pip install -c security/requirements.txt oletools

      - name: Scan
        env:
          LABEL: ${{ inputs.label }}
        run: python security/scan.py --out security-report ${LABEL:+--label "$LABEL"}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: security-report/
          if-no-files-found: error

  security-passed:
    name: Security passed
    if: always()
    needs: [macros]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
