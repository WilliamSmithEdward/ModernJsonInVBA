name: Security scan

# olevba and mraptor scan of every VBA file against security/baseline.json.
# Runs on pushes and pull requests. release-security-report.yml calls it
# when a release is published and attaches the report. See SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: Release name for the report title
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs tags for the report label

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install oletools
        run: python -m pip install -r security/requirements.txt

      - name: Scan
        env:
          LABEL: ${{ inputs.label }}
        run: python security/scan.py --out security-report ${LABEL:+--label "$LABEL"}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: security-report/
          if-no-files-found: error
