name: Release security report

# When a release is published: run the Security and Malware scan workflows
# on the tagged commit, merge the olevba, mraptor, ClamAV and YARA-X results
# into one report, check that the report's SHA-256 hashes match the release's .bas files,
# and attach security-report.md and security-report.json to the release.
#
# Started by hand it is always a dry run: it scans the commit it was started
# on, checks the report against the named release's .bas files, and uploads
# the report as the release-preview artifact instead of attaching it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose .bas files the report is checked against, such as v3.8.5
        required: true
        type: string

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    # The called workflow's zizmor job uploads SARIF to code scanning.
    permissions:
      contents: read
      security-events: write
    with:
      label: ${{ github.event.release.tag_name || inputs.tag }}

  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml

  release-report:
    name: Attach release report
    needs: [security, malware-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install oletools
        run: python -m pip install --require-hashes -r .github/requirements/security.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: malware-results-*
          path: malware-results
          merge-multiple: true

      - name: Write the combined report
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >
          python security/scan.py --out security-report --label "$TAG"
          --malware-results malware-results/malware-results-clamav.json
          --malware-results malware-results/malware-results-yara-x.json

      - name: Check the report's hashes against the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --pattern "*.bas" --dir assets --repo "$GITHUB_REPOSITORY"
          python3 - <<'EOF'
          import hashlib, json, pathlib, sys
          report = json.load(open("security-report/security-report.json"))
          assets = sorted(pathlib.Path("assets").glob("*.bas"))
          if not assets:
              sys.exit("no .bas assets on the release")
          bad = 0
          for asset in assets:
              want = report["release_files"].get("dist/" + asset.name)
              got = hashlib.sha256(asset.read_bytes()).hexdigest()
              print(f"{asset.name}: report {want} release {got}")
              bad += want != got
          sys.exit(1 if bad else 0)
          EOF

      - name: Keep what the release would carry
        if: ${{ !cancelled() && github.event_name != 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: security-report/
          if-no-files-found: error

      - name: Attach report to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "$TAG"
          security-report/security-report.md
          security-report/security-report.json
          --repo "$GITHUB_REPOSITORY" --clobber
